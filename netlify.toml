# Static site, no build step: publish the repo root as-is.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# HTML should always revalidate so edits go live immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Filenames are not fingerprinted, so a long max-age strands returning
# visitors on stale CSS and images for a day after every deploy — Netlify
# purges its CDN on deploy, but browser caches keep serving the old copy.
# Revalidate instead: Netlify sends strong ETags, so unchanged files cost a
# 304 rather than a re-download.
[[headers]]
  for = "/screenshots/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
